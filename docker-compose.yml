services:
  app:
    build: .
    ports:
      - "8901:8901"
      - "8900:8900"
    env_file: .env
    environment:
      # 容器内访问 compose 服务名（覆盖 .env 中的 localhost）
      REDIS_URL: redis://redis:6379/0
      # 使用 --profile local-db 时由下方 postgres 提供数据库
      DATABASE_URL: postgresql://tmss:tmss@postgres:5432/tmss_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 宿主机构建 frontend/dist 后挂载，容器内才能提供 /dashboard 等 SPA 路由
      - ./frontend/dist:/app/frontend/dist:ro
      # 正射影像瓦片、monitor 等静态资源
      - ./static:/app/static:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tmss_db
      POSTGRES_USER: tmss
      POSTGRES_PASSWORD: tmss
    ports:
      - "5433:5432"   # 改用 5433 避免与宿主机已有 PostgreSQL 冲突
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmss -d tmss_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - local-db   # 默认不启动，使用宿主机已有 PostgreSQL 时不需要此服务

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
