# TMSS nginx 生产配置
# 用途：80 端口托管前端静态资源，/api/* 反代到后端 8900 端口
#
# 使用方式：
#   cp nginx.conf /etc/nginx/conf.d/tmss.conf   # 放入 conf.d
#   nginx -t                                     # 语法检查
#   nginx -s reload                              # 热重载

server {
    listen 80;
    server_name _;          # 替换为实际域名或 IP

    # 前端打包产物目录（与 npm run build 输出一致）
    root /root/workspace/tmss-server/frontend/dist;
    index index.html;

    # ── API 反向代理 ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8900;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE / 长连接：禁止缓冲，否则 EventSource 收不到数据
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 前端静态资源（带强缓存）────────────────────────────────
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── SPA 路由兜底 ────────────────────────────────────────────
    # 所有非 /api、非静态资源的路径均返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
