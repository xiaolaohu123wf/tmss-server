[project]
name = "tmss-server"
version = "1.5.0"
requires-python = ">=3.9"
dependencies = [
    # HTTP
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",

    # 数据库
    "asyncpg>=0.29",
    "alembic>=1.13",

    # 数据模型
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",

    # 缓存
    "redis[asyncio]>=5.0",

    # HTTP 客户端（天气 API）
    "httpx>=0.27",

    # 日志
    "structlog>=24.0",

    # 安全
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "testcontainers[redis]>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "ANN",
    "ASYNC",
    "B",
    "SIM",
    "RET",
    "PL",
    "T20",
]
ignore = [
    "ANN101",
    "ANN102",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]
"alembic/**" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
