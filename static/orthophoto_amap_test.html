<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正射影像 × 高德卫星（测试）</title>
  <script>
    window._AMapSecurityConfig = { securityJsCode: 'cc48ce721d87c8f2222dcd65624a6005' }
    ;(function () {
      const _get = HTMLCanvasElement.prototype.getContext
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === '2d') attrs = Object.assign({ willReadFrequently: true }, attrs)
        return _get.call(this, type, attrs)
      }
    })()
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=91974428fa4957121585bd2d90d842d4"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    #map { height: 100%; width: 100%; background: #000; }
    #bar {
      position: absolute; z-index: 500; left: 12px; top: 12px;
      background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 8px;
      font: 13px/1.6 system-ui, sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.15);
      max-width: min(340px, calc(100vw - 24px));
    }
    #bar h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 6px 0; }
    .section-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    #bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; }
    #bar input[type="range"] { width: 120px; }
    #bar .row-opacity { display: flex; align-items: center; gap: 8px; margin-left: 22px; }
    #bar .row-opacity input[type="range"] { width: 100px; }
    #err { color: #b91c1c; margin-top: 8px; font-size: 12px; white-space: pre-wrap; }
    #hint { color: #475569; font-size: 11px; margin-top: 6px; line-height: 1.5; }
    #coord-panel {
      position: absolute; z-index: 500; right: 12px; bottom: 40px;
      background: rgba(0,0,0,.78); color: #e2e8f0; padding: 8px 12px;
      border-radius: 8px; font: 12px/1.6 monospace; pointer-events: none;
      min-width: 260px;
    }
    #coord-panel b { color: #7dd3fc; }
  </style>
</head>
<body>
  <div id="bar">
    <h3>正射 DOM · 对齐检查</h3>
    <hr class="divider" />

    <div class="section-label">图层</div>

    <label>
      <input type="checkbox" id="ck-satellite" checked />
      高德卫星底图
    </label>

    <label>
      <input type="checkbox" id="ck-dom" checked />
      正射影像（DOM）
    </label>
    <div class="row-opacity">
      <span id="op-lbl">95%</span>
      <input type="range" id="op" min="0" max="100" value="95" title="正射层透明度" />
    </div>

    <hr class="divider" />
    <div class="section-label">底色</div>
    <label>
      <input type="checkbox" id="ck-black" checked />
      黑色底（隐藏卫星时可见）
    </label>

    <hr class="divider" />
    <div class="section-label">诊断</div>
    <label>
      <input type="checkbox" id="ck-bounds" checked />
      GCJ02 边界框（红框）
    </label>
    <label>
      <input type="checkbox" id="ck-center" checked />
      中心标记（蓝点）
    </label>

    <div id="err"></div>
    <div id="hint">若正射层空白：先运行 <code>scripts/tile_dom_gcj_amap.sh</code>。</div>
  </div>
  <div id="map"></div>
  <div id="coord-panel">点击地图查看坐标</div>
  <script>
    const errEl = document.getElementById('err')
    const coordPanel = document.getElementById('coord-panel')

    function tileUrl(z, x, y, suffix, fmt) {
      return suffix + '/' + z + '/' + x + '/' + y + '.' + fmt
    }

    // ── GCJ-02 ↔ WGS-84 helpers (client-side, for diagnostics only) ──────────
    function _outOfChina(lng, lat) {
      return !(73.66 < lng && lng < 135.05 && 3.86 < lat && lat < 53.55)
    }
    function _transformLat(x, y) {
      let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x))
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3
      r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3
      r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3
      return r
    }
    function _transformLng(x, y) {
      let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x))
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3
      r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3
      r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3
      return r
    }
    function wgs84ToGcj02(lng, lat) {
      if (_outOfChina(lng, lat)) return [lng, lat]
      const a = 6378245.0, ee = 0.00669342162296594323
      let dlat = _transformLat(lng - 105, lat - 35)
      let dlng = _transformLng(lng - 105, lat - 35)
      const radlat = lat / 180 * Math.PI
      let magic = Math.sin(radlat)
      magic = 1 - ee * magic * magic
      const sq = Math.sqrt(magic)
      dlat = dlat * 180 / (a * (1 - ee) / (magic * sq) * Math.PI)
      dlng = dlng * 180 / (a / sq * Math.cos(radlat) * Math.PI)
      return [lng + dlng, lat + dlat]
    }
    // Iterative inverse (5 iterations is sufficient for ~cm accuracy)
    function gcj02ToWgs84(lng, lat) {
      if (_outOfChina(lng, lat)) return [lng, lat]
      let wLng = lng, wLat = lat
      for (let i = 0; i < 5; i++) {
        const [gLng, gLat] = wgs84ToGcj02(wLng, wLat)
        wLng -= gLng - lng
        wLat -= gLat - lat
      }
      return [wLng, wLat]
    }

    fetch('/static/map/orthophoto_amap_meta.json', { cache: 'no-store' })
      .then((r) => {
        if (!r.ok) throw new Error('meta HTTP ' + r.status + ' — 请生成 orthophoto_amap_meta.json')
        return r.json()
      })
      .then((meta) => {
        const suffix = meta.tileUrlSuffix || '/static/map/tiles_dom'
        const fmt = meta.tileFormat || 'png'
        const [lng, lat] = meta.center_gcj_lnglat || [109.2695, 30.383164]
        const sw = meta.bounds_gcj_lnglat.southwest
        const ne = meta.bounds_gcj_lnglat.northeast

        // 卫星层单独创建，方便控制显隐
        const satelliteLayer = new AMap.TileLayer.Satellite({ zIndex: 2 })

        const map = new AMap.Map('map', {
          zoom: 16,
          center: [lng, lat],
          // 不在 layers 里放，避免无法独立控制
          layers: [],
          background: 'transparent',
        })
        map.add(satelliteLayer)

        AMap.plugin(['AMap.Scale', 'AMap.ToolBar'], function () {
          map.addControl(new AMap.Scale())
          map.addControl(new AMap.ToolBar({ liteStyle: true }))
        })

        // 正射影像层
        const domLayer = new AMap.TileLayer({
          zIndex: 6,
          opacity: 0.95,
          getTileUrl: function (x, y, z) {
            return tileUrl(z, x, y, suffix, fmt)
          },
        })
        map.add(domLayer)

        // ── 高德卫星开关 ──────────────────────────────
        const ckSatellite = document.getElementById('ck-satellite')
        ckSatellite.addEventListener('change', () => {
          satelliteLayer[ckSatellite.checked ? 'show' : 'hide']()
        })

        // ── 正射层开关 ────────────────────────────────
        const ckDom = document.getElementById('ck-dom')
        ckDom.addEventListener('change', () => {
          domLayer[ckDom.checked ? 'show' : 'hide']()
        })

        // ── 透明度滑块 ────────────────────────────────
        const op = document.getElementById('op')
        const opLbl = document.getElementById('op-lbl')
        op.addEventListener('input', () => {
          const v = Number(op.value) / 100
          domLayer.setOpacity(v)
          opLbl.textContent = Math.round(v * 100) + '%'
        })

        // ── 黑色底开关（控制 #map 背景色）────────────
        const ckBlack = document.getElementById('ck-black')
        const mapEl = document.getElementById('map')
        ckBlack.addEventListener('change', () => {
          mapEl.style.background = ckBlack.checked ? '#000' : 'transparent'
        })

        try {
          map.setBounds(new AMap.Bounds(sw, ne), false, [40, 40, 40, 40])
        } catch (e) {
          console.warn(e)
        }

        // ── 诊断：GCJ02 边界框（红色多边形）────────────────────
        const boundsRect = new AMap.Polygon({
          path: [sw, [ne[0], sw[1]], ne, [sw[0], ne[1]]],
          strokeColor: '#ef4444', strokeWeight: 2, strokeOpacity: 0.9,
          fillOpacity: 0, zIndex: 20,
        })
        map.add(boundsRect)

        // ── 诊断：GCJ02 中心标记（蓝色圆点）────────────────────
        const centerMarker = new AMap.CircleMarker({
          center: [lng, lat],
          radius: 6,
          fillColor: '#3b82f6', fillOpacity: 1,
          strokeColor: '#fff', strokeWeight: 2,
          zIndex: 21,
        })
        map.add(centerMarker)

        // ── 诊断：开关 ──────────────────────────────────────────
        document.getElementById('ck-bounds').addEventListener('change', (e) => {
          boundsRect[e.target.checked ? 'show' : 'hide']()
        })
        document.getElementById('ck-center').addEventListener('change', (e) => {
          centerMarker[e.target.checked ? 'show' : 'hide']()
        })

        // ── 诊断：点击坐标（GCJ02 + 近似 WGS84）────────────────
        map.on('click', (ev) => {
          const gcjLng = ev.lnglat.getLng().toFixed(6)
          const gcjLat = ev.lnglat.getLat().toFixed(6)
          const [wgsLng, wgsLat] = gcj02ToWgs84(Number(gcjLng), Number(gcjLat))
          coordPanel.innerHTML =
            `<b>GCJ-02</b>  ${gcjLng}, ${gcjLat}<br>` +
            `<b>WGS-84</b>  ${wgsLng.toFixed(6)}, ${wgsLat.toFixed(6)}<br>` +
            `<span style="color:#94a3b8;font-size:11px">偏移≈ Δlng ${(Number(gcjLng)-wgsLng).toFixed(4)}° Δlat ${(Number(gcjLat)-wgsLat).toFixed(4)}°</span>`
        })
      })
      .catch((e) => {
        errEl.textContent = String(e.message || e)
      })
  </script>
</body>
</html>
